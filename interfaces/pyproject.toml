[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomap-interfaces"
version = "0.1.0"
description = "Provisional read-only discovery, TileJSON, WMS 1.3.0, and MCP interfaces for geo-map PNG pyramids."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
cog = ["rasterio>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
geomap-interfaces = "geomap_interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
