AWSTemplateFormatVersion: "2010-09-09"
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # dynamodb:TransactWriteItems is a real IAM action. This cfn-lint
        # build's IAM vocabulary omits it.
        - W3037
Description: >
  Isolated staging registry and admin console for geo-map layer metadata.
  Account 544020760996 and us-west-2 only. Private S3 and CloudFront default
  domain, HTTP API, Lambda, DynamoDB, and an empty Cognito pool. Does not
  create DNS records, does not change admin.terrapulse.com, and does not
  read or write production tile buckets. The tile-backend base URL is empty
  until the parent supplies a test endpoint.

Rules:
  AuthorizedTarget:
    Assertions:
      - Assert: !Equals [!Ref "AWS::AccountId", "544020760996"]
        AssertDescription: Deploy only in terraPulse account 544020760996. The executor CLI profile is tp. Do not use profile 6g.
      - Assert: !Equals [!Ref "AWS::Region", "us-west-2"]
        AssertDescription: Deploy only in us-west-2 (Oregon).
      - Assert: !Equals [!Select [0, !Split ["geo-map-tiles", !Ref SourceBucketName]], !Ref SourceBucketName]
        AssertDescription: SourceBucketName must not refer to a production tile bucket.
      - Assert: !Equals [!Select [0, !Split ["map-tiles-dev", !Ref SourceBucketName]], !Ref SourceBucketName]
        AssertDescription: SourceBucketName must not refer to map-tiles-dev.

Parameters:
  ProjectName:
    Type: String
    Default: geo-map-layer-manager
    AllowedPattern: "^geo-map-layer-manager$"
  Stage:
    Type: String
    Default: staging
    AllowedValues: [staging]
  ArtifactBucketName:
    Type: String
    Default: geo-map-layer-manager-staging-artifacts-544020760996
    AllowedPattern: "^geo-map-layer-manager-staging-artifacts-544020760996$"
    Description: Bootstrap stack output. This is not a tile bucket.
  ArtifactKey:
    Type: String
    AllowedPattern: "^lambda/[A-Za-z0-9._/-]+\\.zip$"
    Description: Key of the packaged Lambda zip in the artifact bucket. No default, so the stack cannot be created before the zip is uploaded.
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
    Description: Globally unique hosted-UI prefix. Suggested tp-geomap-layers-544020760996. No users are created.
  ReservedConcurrentExecutions:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
  EnablePitr:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  SeedSyntheticFixtures:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Insert labeled synthetic fixtures when missing. Does not overwrite and does not read production metadata.
  PreviewAllowedHosts:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?(,https://[A-Za-z0-9.-]+(:[0-9]+)?){0,7}$"
    Description: Extra https origins whose stored tile templates may be displayed. Empty by default. The browser does not request them.
  TileBackendBaseUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$"
    Description: >
      Optional base URL for the isolated performance-branch test API.
      Leave empty until that endpoint exists. Do not use admin.terrapulse.com,
      a geo-map-tiles bucket, or map-tiles-dev. This stack never calls the URL.
  TilePathOrder:
    Type: String
    Default: map
    AllowedValues: [map, zx_y, zxy, xyz]
    Description: Historical tile path used only to compose a preview address.
  RendererInvokeEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, the admin Lambda may invoke only
      arn:aws:lambda:us-west-2:544020760996:function:geomap-tile-pyramid-test.
      The function URL is not used and the admin token is not forwarded.
  EnableBuilds:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Intent to allow real builds. Stays off unless the source bucket, image, subnets, and security group are also set. The API Lambda does not render tiles.
  SourceBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Optional read-only dataset bucket. Empty disables real builds. Do not use a tile bucket.
  SourceKeyPrefix:
    Type: String
    Default: "datasets/"
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$"
    Description: Prefix inside SourceBucketName. The job role may only read this prefix, and only when the build resources are created.
  BuildImageUri:
    Type: String
    Default: ""
    AllowedPattern: "^$|^544020760996\\.dkr\\.ecr\\.us-west-2\\.amazonaws\\.com/geo-map-layer-manager-worker:[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    Description: ECR image in this account only. Empty keeps Batch out of the stack. The tag latest is rejected by the submitter. This template does not build or push the image.
  BuildSubnetIds:
    Type: String
    Default: ""
    AllowedPattern: "^$|^subnet-[a-z0-9]+(,subnet-[a-z0-9]+){0,3}$"
    Description: Comma-separated subnet ids for Fargate. Public subnets avoid a NAT gateway. Empty keeps Batch out of the stack.
  BuildSecurityGroupId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^sg-[a-z0-9]+$"
    Description: Security group for the Fargate task. Empty keeps Batch out of the stack.

Conditions:
  UsePitr: !Equals [!Ref EnablePitr, "true"]
  InvokeRenderer: !Equals [!Ref RendererInvokeEnabled, "true"]
  RealBuilds: !And
    - !Equals [!Ref EnableBuilds, "true"]
    - !Not [!Equals [!Ref SourceBucketName, ""]]
  BuildInfra: !And
    - !Condition RealBuilds
    - !Not [!Equals [!Ref BuildImageUri, ""]]
    - !Not [!Equals [!Ref BuildSubnetIds, ""]]
    - !Not [!Equals [!Ref BuildSecurityGroupId, ""]]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-${Stage}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: geo-map-layer-manager
        - Key: Stage
          Value: staging

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-${Stage}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectName}-${Stage}-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub
              - "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://${Prefix}.auth.${AWS::Region}.amazoncognito.com https://*.execute-api.${AWS::Region}.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://${Prefix}.auth.${AWS::Region}.amazoncognito.com; object-src 'none'"
              - Prefix: !Ref CognitoDomainPrefix
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
            Preload: false

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ProjectName}-${Stage}-static"
        DefaultTTL: 3600
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ConfigCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${ProjectName}-${Stage}-config"
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName}-${Stage} private console"
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: !Ref StaticCachePolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
        CacheBehaviors:
          - PathPattern: config.js
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref ConfigCachePolicy
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  RegistryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-${Stage}-registry-${AWS::AccountId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePitr, true, false]
      DeletionProtectionEnabled: false
      Tags:
        - Key: Project
          Value: geo-map-layer-manager
        - Key: Stage
          Value: staging

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Stage}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      DeletionProtection: INACTIVE

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-${Stage}-spa"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub "https://${Distribution.DomainName}/"
      LogoutURLs:
        - !Sub "https://${Distribution.DomainName}/"
      SupportedIdentityProviders: [COGNITO]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: layer-admin
      Description: Registry editors. Assigned by an administrator. The pool starts empty.
      Precedence: 1
      UserPoolId: !Ref UserPool

  ReaderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: layer-reader
      Description: Registry readers. Assigned by an administrator. The pool starts empty.
      Precedence: 2
      UserPoolId: !Ref UserPool

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Stage}-api"
      RetentionInDays: 14

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${ProjectName}-${Stage}"
      RetentionInDays: 14

  ApiAccessLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${ProjectName}-${Stage}-api-logs"
      PolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"Service": "apigateway.amazonaws.com"},
                "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
                "Resource": "${LogArn}:*"
              }
            ]
          }
        - LogArn: !GetAtt ApiAccessLogGroup.Arn

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: registry-staging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RegistryItems
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt RegistryTable.Arn
              - Sid: WriteOwnLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ApiLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: geo-map-layer-manager
        - Key: Stage
          Value: staging

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Stage}-api"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: layer_manager_lambda.handler
      Timeout: 15
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          LAYER_MANAGER_ENV: staging
          LAYER_MANAGER_AUTH_MODE: apigateway-cognito
          LAYER_MANAGER_REPOSITORY: dynamodb
          LAYER_MANAGER_DYNAMODB_TABLE: !Ref RegistryTable
          LAYER_MANAGER_DYNAMODB_REGION: !Ref AWS::Region
          LAYER_MANAGER_COGNITO_REGION: !Ref AWS::Region
          LAYER_MANAGER_COGNITO_USER_POOL_ID: !Ref UserPool
          LAYER_MANAGER_COGNITO_CLIENT_ID: !Ref UserPoolClient
          LAYER_MANAGER_SEED_FIXTURES: "0"
          LAYER_MANAGER_ALLOW_FIXTURE_AUTH: "0"
          LAYER_MANAGER_EMIT_CORS: "0"
          LAYER_MANAGER_PREVIEW_HOSTS: !Ref PreviewAllowedHosts
          LAYER_MANAGER_CORS_ORIGINS: !Sub "https://${Distribution.DomainName}"
          LAYER_MANAGER_TILE_BACKEND_BASE_URL: !Ref TileBackendBaseUrl
          LAYER_MANAGER_TILE_PATH_ORDER: !Ref TilePathOrder
          LAYER_MANAGER_RENDERER_MODE: !If [InvokeRenderer, "lambda", "disabled"]
          LAYER_MANAGER_RENDERER_FUNCTION_ARN: !If
            - InvokeRenderer
            - "arn:aws:lambda:us-west-2:544020760996:function:geomap-tile-pyramid-test"
            - ""
          LAYER_MANAGER_BUILDS_ENABLED: !If [RealBuilds, "true", "false"]
          LAYER_MANAGER_BUILD_EXECUTOR: !If [BuildInfra, "rasterio", "disabled"]
          LAYER_MANAGER_ORCHESTRATOR: !If [BuildInfra, "batch", "in-process"]
          LAYER_MANAGER_BUILD_QUEUE_URL: !If [BuildInfra, !Ref BuildQueue, ""]
          LAYER_MANAGER_S3_READS: !If [BuildInfra, "true", "false"]
          LAYER_MANAGER_SOURCE_ALLOWLIST: !If
            - RealBuilds
            - !Sub "datasets=s3://${SourceBucketName}/${SourceKeyPrefix}"
            - ""
          LAYER_MANAGER_OUTPUT_PREFIX: builds
          LAYER_MANAGER_MAX_BUILD_TILES: "32"
          LAYER_MANAGER_BUILD_ABSOLUTE_MAX: "256"

  RendererInvokePolicy:
    Type: AWS::IAM::Policy
    Condition: InvokeRenderer
    Properties:
      PolicyName: invoke-geomap-tile-pyramid-test
      Roles:
        - !Ref ApiRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeTileTestOnly
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: arn:aws:lambda:us-west-2:544020760996:function:geomap-tile-pyramid-test

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Stage}"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${Distribution.DomainName}"
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
        AllowCredentials: false

  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: cognito-staging
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 10000

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /v1/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub "integrations/${ApiIntegration}"

  # OPTIONS matches ANY and was invoking the JWT authorizer, so browser
  # preflight received 401. This route is only the preflight. It returns
  # no registry data. GET, POST, and PATCH stay on ApiRoute.
  OptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "OPTIONS /v1/{proxy+}"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status","authorizerError":"$context.authorizer.error"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

  SeedInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: cloudformation.amazonaws.com
      SourceArn: !Ref AWS::StackId

  SyntheticSeed:
    Type: Custom::SyntheticSeed
    DependsOn: SeedInvokePermission
    Properties:
      ServiceToken: !GetAtt ApiFunction.Arn
      SeedSyntheticFixtures: !Ref SeedSyntheticFixtures
      SchemaId: geo-map.layer-registry.v1

  BuildOutputBucket:
    Type: AWS::S3::Bucket
    Condition: BuildInfra
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-${Stage}-builds-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-build-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  BuildDlq:
    Type: AWS::SQS::Queue
    Condition: BuildInfra
    Properties:
      MessageRetentionPeriod: 1209600

  BuildQueue:
    Type: AWS::SQS::Queue
    Condition: BuildInfra
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BuildDlq.Arn
        maxReceiveCount: 3

  BuildJobRole:
    Type: AWS::IAM::Role
    Condition: BuildInfra
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pyramid-object-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAllowlistedSource
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/${SourceKeyPrefix}*"
              - Sid: ListAllowlistedSource
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "${SourceKeyPrefix}*"
              - Sid: WriteVersionedOutput
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${BuildOutputBucket}/builds/*"

  BuildExecutionRole:
    Type: AWS::IAM::Role
    Condition: BuildInfra
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  BuildComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Condition: BuildInfra
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 4
        Subnets: !Split [",", !Ref BuildSubnetIds]
        SecurityGroupIds:
          - !Ref BuildSecurityGroupId

  BuildJobQueue:
    Type: AWS::Batch::JobQueue
    Condition: BuildInfra
    Properties:
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BuildComputeEnvironment

  BuildJobDefinition:
    Type: AWS::Batch::JobDefinition
    Condition: BuildInfra
    Properties:
      Type: container
      PlatformCapabilities:
        - FARGATE
      Timeout:
        AttemptDurationSeconds: 3600
      RetryStrategy:
        Attempts: 2
      ContainerProperties:
        Image: !Ref BuildImageUri
        Command:
          - python
          - -m
          - layer_manager.worker_main
        ResourceRequirements:
          - Type: VCPU
            Value: "1"
          - Type: MEMORY
            Value: "2048"
        ExecutionRoleArn: !GetAtt BuildExecutionRole.Arn
        JobRoleArn: !GetAtt BuildJobRole.Arn
        NetworkConfiguration:
          AssignPublicIp: ENABLED
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BuildJobLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: pyramid
        Environment:
          - Name: BUILD_ALLOW_S3
            Value: "1"
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: BUILD_OUTPUT_BUCKET
            Value: !Ref BuildOutputBucket
          - Name: BUILD_SOURCE_ALLOWLIST
            Value: !Sub "datasets=s3://${SourceBucketName}/${SourceKeyPrefix}"

  BuildSubmitterRole:
    Type: AWS::IAM::Role
    Condition: BuildInfra
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: submit-one-batch-job
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBuildQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt BuildQueue.Arn
              - Sid: SubmitPyramidJob
                Effect: Allow
                Action:
                  - batch:SubmitJob
                Resource:
                  - !Ref BuildJobQueue
                  - !Ref BuildJobDefinition
              - Sid: PassKnownTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt BuildJobRole.Arn
                  - !GetAtt BuildExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: WriteSubmitterLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BuildSubmitterLogGroup.Arn}:*"

  BuildJobLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: BuildInfra
    Properties:
      RetentionInDays: 14

  BuildSubmitterLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: BuildInfra
    Properties:
      RetentionInDays: 14

  BuildSubmitter:
    Type: AWS::Lambda::Function
    Condition: BuildInfra
    Properties:
      FunctionName: !Sub "${ProjectName}-${Stage}-build-submit"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: layer_manager.batch_submit.handler
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      Role: !GetAtt BuildSubmitterRole.Arn
      LoggingConfig:
        LogGroup: !Ref BuildSubmitterLogGroup
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          BUILD_JOB_QUEUE: !Ref BuildJobQueue
          BUILD_JOB_DEFINITION: !Ref BuildJobDefinition
          BUILD_IMAGE_URI: !Ref BuildImageUri
          BUILD_SOURCE_ALLOWLIST: !Sub "datasets=s3://${SourceBucketName}/${SourceKeyPrefix}"

  BuildSubmitMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: BuildInfra
    Properties:
      EventSourceArn: !GetAtt BuildQueue.Arn
      FunctionName: !Ref BuildSubmitter
      BatchSize: 1

  ApiSourceReadPolicy:
    Type: AWS::IAM::Policy
    Condition: BuildInfra
    Properties:
      PolicyName: read-allowlisted-source
      Roles:
        - !Ref ApiRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadSourceObject
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SourceBucketName}/${SourceKeyPrefix}*"

  ApiBuildEnqueuePolicy:
    Type: AWS::IAM::Policy
    Condition: BuildInfra
    Properties:
      PolicyName: enqueue-pyramid-build
      Roles:
        - !Ref ApiRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnqueueOnly
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt BuildQueue.Arn

Outputs:
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  ConsoleUrl:
    Value: !Sub "https://${Distribution.DomainName}/"
  HttpApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  HttpApiId:
    Value: !Ref HttpApi
  FrontendBucketName:
    Value: !Ref FrontendBucket
  RegistryTableName:
    Value: !Ref RegistryTable
  ApiRoleArn:
    Value: !GetAtt ApiRole.Arn
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UserPoolDomain:
    Value: !Ref UserPoolDomain
  HostedUiBaseUrl:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ApiLogGroupName:
    Value: !Ref ApiLogGroup
  ApiAccessLogGroupName:
    Value: !Ref ApiAccessLogGroup
  SeedInserted:
    Value: !GetAtt SyntheticSeed.Inserted
  TileBackendBaseUrl:
    Value: !Ref TileBackendBaseUrl
  TilePathOrder:
    Value: !Ref TilePathOrder
  TileBackendIntegration:
    Value: address-only-or-unset
    Description: This stack does not call the tile backend and does not claim it is integrated.
  BuildInfraEnabled:
    Value: !If [BuildInfra, "true", "false"]
    Description: Batch, SQS, and the output bucket exist only when this is true. The default deploy leaves it false.
